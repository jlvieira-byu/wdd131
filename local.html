<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curitiba - João L. Vieira</title>
    <meta name="description"
        content="Página de tarefa do aluno João L. Vieira no aprendizado do curso WDD 131 – Fundamentos da Web Dinâmica, com especificações da atividade S03">
    <meta name="author" content="João L. Vieira">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Farro:wght@300;400;500;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="estilos/local.css">

    <script src="scripts/local.js" defer></script>
</head>

<body>
    <header>
        <h1>Curitiba</h1>
    </header>
    <div class="header-faixa"></div>

    <main>
        <picture>
            <source srcset="imagens/museu-oscar-niemeyer-curitiba-grande.webp" media="(min-width: 650px)">
            <!-- <source srcset="imagens/museu-oscar-niemeyer-curitiba-medio.webp" media="(min-width: 600px)"> -->
            <img src="imagens/jardim-botanico-curitiba-pequeno.webp" alt="Jardim Botânico de Curitiba">
        </picture>

        <article id="dados">
            <h2>Dados</h2>
            <p><strong>Área: </strong>434.892 km²</p>
            <p><strong>População: </strong>1.830.795 hab.</p>
            <p><strong>Altitude: </strong>934 m</p>
            <p><strong>Idioma: </strong>português</p>
            <p><strong>IDH: </strong>0,823</p>
            <p><strong>Fuso horário: </strong>UTC-3</p>
            <p><strong>Fundação: </strong>meados de 1661</p>
        </article>

        <article id="clima">
            <h2>Clima</h2>
            <img src="imagens/icone-dia-limpo.svg" alt="Ícone de dia ensolarado" class="icone-clima">
            <p><strong>Temperatura: </strong><span id="temperatura">10 °C</span></p>
            <p><strong>Condições: </strong> ensolarado</p>
            <p><strong>Vento: </strong><span id="vento">9 km/h</span></p>
            <p><strong>Sensação térmica: </strong><span id="sensacao">--</span></p>
        </article>
    </main>


    <footer>
        <p class="copyright">&copy; <span id="ano-atual"></span> &#10070; João L. Vieira &#10070; Brasil</p>
        <p class="ultima-modificacao" id="ultima-modificacao">Última modificação:</p>
    </footer>
</body>

</html>
